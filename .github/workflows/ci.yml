name: Github Action CI

on:
  push:
    branches:
    - main
    tags:
    - 'v*'
  pull_request:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: install
      run: |
        sudo apt-get update
        sudo apt-get install latexmk libalgorithm-diff-perl texlive texlive-latex-extra texlive-humanities graphviz
        pip3 install --user mako
        pip3 install --user typing
        pip3 install --user Sphinx
        pip3 install --user codespell

    - name: fetch tags
      # actions/checkout creates lightweight tags locally even when the
      # source tag is annotated, which causes 'git describe --exact-match'
      # to miss it. Refetching pulls the proper annotated tag.
      run: git fetch --tags --force

    - name: build pdf
      run: |
        make latexpdf
        mv build/latex/fit-specification.pdf build/latex/fit-specification-$(git describe).pdf
    - name: build html
      run: make html
    - name: build singlehtml
      run: make singlehtml

    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: artifacts
        path: |
          build/latex/fit-specification-*.pdf

    # pr-preview.yml publishes this, since a fork's token cannot write
    - name: stage preview
      if: github.event_name == 'pull_request'
      env:
        PR_NUMBER: ${{ github.event.number }}
      run: |
        mkdir preview
        cp -r build/singlehtml preview/site
        echo "$PR_NUMBER" > preview/pr-number

    - name: upload preview
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: preview
        path: preview/
        retention-days: 1

    - name: upload site
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: site
        path: build/singlehtml/
        retention-days: 1

    - name: release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: build/latex/fit-specification-*.pdf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with every other job that pushes to gh-pages
    concurrency:
      group: gh-pages
      cancel-in-progress: false

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: site
        path: site

    # Keep the pull-request previews under pr-preview/
    - name: deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
        keep_files: true
